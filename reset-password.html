<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Static Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' https://cdn.jsdelivr.net; 
                   style-src 'self' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   connect-src 'self' https://*.supabase.co; 
                   img-src 'self' data: https:; base-uri 'self'; 
                   form-action 'self';">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    
    <title>Reset Password - Stokika</title>
    <link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico.png">
    
    <!-- Google Fonts with SRI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" 
          rel="stylesheet"
          integrity="sha384-zM7qmLDXsv7G43sbK2VNrYGye2a5RuU56GHc3OZBpSLeQ4MVC+kkxdOzkOEjKo48"
          crossorigin="anonymous">
    
    <!-- Page Styles -->
    <link rel="stylesheet" href="css/pages/reset-password.css">
</head>
<body>
    <div class="reset-container">
        <h2>Reset Your Password</h2>
        <div id="message"></div>
        <form id="resetForm" data-sanitize="true">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" 
                       id="email" 
                       name="email"
                       required 
                       placeholder="your.email@example.com"
                       data-sanitize-type="email"
                       autocomplete="email">
                <small>Verify your email address</small>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" 
                       id="newPassword" 
                       name="newPassword"
                       required 
                       minlength="12" 
                       maxlength="128"
                       placeholder="Minimum 12 characters"
                       data-sanitize-type="string"
                       autocomplete="new-password">
                <div class="password-requirements">
                    <small>Minimum 12 characters with uppercase, lowercase, number, and special character</small>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" 
                       id="confirmPassword" 
                       name="confirmPassword"
                       required 
                       minlength="12"
                       maxlength="128"
                       data-sanitize-type="string"
                       autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">Reset Password</button>
        </form>
    </div>

    <!-- Supabase CDN with SRI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
            integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
            crossorigin="anonymous"></script>
    
    <!-- Core Configuration (load before page module) -->
    <script src="js/core/config-loader.js"></script>
    <script src="js/core/setup.js"></script>
    
    <!-- Feature Modules (non-module scripts) -->
    <script src="js/features/user-settings.js"></script>
    
    <!-- Security Modules (non-module scripts) -->
    <script src="js/security/xss-protection.js"></script>
    <script src="js/security/secure-session.js"></script>
    <script src="js/security/csrf-protection.js"></script>
    
    <!-- Page Module (ES6 Module) - Handles all page logic -->
    <script src="js/pages/reset-password.page.js" type="module"></script>
</body>
</html>
