<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=dalana">
    <title>Stokika - Welcome</title>
    <link rel="icon" type="image/png" href="assets/images/stokika-logo.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo {
            width: 150px;
            height: 150px;
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-in;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: fadeIn 0.7s ease-in;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeIn 0.9s ease-in;
        }
        .loader {
            margin-top: 2rem;
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .fallback {
            margin-top: 2rem;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .fallback a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/images/stokika-logo.png" alt="Stokika Logo" class="logo" onerror="this.style.display='none'">
        <h1>Welcome to Stokika</h1>
        <p>Redirecting you to supplier registration...</p>
        <div class="loader"></div>
        <p class="fallback">
            If you are not redirected automatically, 
            <a href="dalana">click here</a>
        </p>
    </div>
    <script>
        // Immediate redirect (fallback if meta refresh fails)
        setTimeout(function() {
            window.location.href = 'dalana';
        }, 100);
    </script>
</body>
</html>
