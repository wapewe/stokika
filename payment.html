<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Static CSP Meta Tag -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' https://cdn.jsdelivr.net; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   connect-src 'self' https://*.supabase.co; 
                   img-src 'self' data: https:; base-uri 'self'; 
                   form-action 'self';">
    
    <title>Make Payment - Stokika</title>
    <link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico.png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" 
          rel="stylesheet"
          crossorigin="anonymous">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/payments.css">
    
    <style>
        .payment-form {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        .form-group .error-message {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .submit-btn:hover {
            background: #45a049;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .payments-grid {
            display: grid;
            gap: 16px;
            margin-top: 24px;
        }
        
        .payment-card {
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        
        .payment-card.status-verified {
            border-left: 4px solid #4CAF50;
        }
        
        .payment-card.status-pending {
            border-left: 4px solid #FFC107;
        }
        
        .payment-card.status-rejected {
            border-left: 4px solid #f44336;
        }
        
        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        
        .payment-reference {
            color: #333;
            font-size: 14px;
        }
        
        .payment-amount {
            color: #4CAF50;
            font-size: 18px;
            font-weight: 600;
        }
        
        .payment-details {
            color: #666;
            font-size: 12px;
        }
        
        .payment-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .payment-status.status-verified {
            background: #E8F5E9;
            color: #2E7D32;
        }
        
        .payment-status.status-pending {
            background: #FFF9C4;
            color: #F57C00;
        }
        
        .payment-status.status-rejected {
            background: #FFEBEE;
            color: #C62828;
        }
        
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 24px;
        }
        
        .pagination-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <a href="https://www.stokika.com" target="_blank" rel="noopener noreferrer">
                    <img src="assets/logos/logo.png.png" alt="Stokika" class="logo-img" id="dashboardLogo">
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="vendor-dashboard.html" class="nav-item"><span>Dashboard</span></a>
                <a href="stock-request.html" class="nav-item"><span>Request Stock</span></a>
                <a href="orders.html" class="nav-item"><span>Orders</span></a>
                <a href="payment.html" class="nav-item active"><span>Make Payment</span></a>
                <a href="payments.html" class="nav-item"><span>Payment History</span></a>
                <a href="settings.html" class="nav-item"><span>Settings</span></a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="dashboard-header">
                <h1>Make Payment</h1>
            </header>
            
            <section class="card">
                <h2>Payment Information</h2>
                <div class="payment-form">
                    <form id="paymentForm">
                        <div class="form-group">
                            <label for="stockRequestId">Stock Request ID *</label>
                            <input 
                                type="text" 
                                id="stockRequestId" 
                                name="stockRequestId"
                                placeholder="Enter stock request ID"
                                required>
                            <div class="error-message" id="stockRequestId-error"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="phoneNumber">M-Pesa Phone Number *</label>
                            <input 
                                type="tel" 
                                id="phoneNumber" 
                                name="phoneNumber"
                                placeholder="254XXXXXXXXX"
                                pattern="^254[0-9]{9}$"
                                required>
                            <div class="error-message" id="phoneNumber-error"></div>
                            <small style="color: #666;">Format: 254XXXXXXXXX (e.g., 254712345678)</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="paymentMethod">Payment Method</label>
                            <select id="paymentMethod" name="paymentMethod">
                                <option value="mpesa">M-Pesa</option>
                                <option value="bank_transfer">Bank Transfer</option>
                                <option value="cash">Cash</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="submit-btn">
                            Initiate Payment
                        </button>
                    </form>
                </div>
            </section>
            
            <section class="card" style="margin-top: 24px;">
                <h2>Recent Payments</h2>
                <div id="paymentsList"></div>
                <div id="paginationContainer" class="pagination-container" style="display: none;">
                    <button id="prevPage" class="pagination-btn">Previous</button>
                    <span id="pageInfo"></span>
                    <button id="nextPage" class="pagination-btn">Next</button>
                </div>
            </section>
        </main>
    </div>
    
    <!-- CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
            crossorigin="anonymous"></script>
    
    <!-- Compiled TypeScript -->
    <script src="dist/payment.js"></script>
</body>
</html>
